[package]
name = "codex-zh-contracts"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "codex-zh-contracts"
path = "contracts.rs"

[dependencies]
syn = { version = "=2.0.117", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
