name: 校验项目
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 校验清单、补丁和项目文件
        run: node tools/verify.mjs
      - name: 检查 PowerShell 语法
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | Write-Error; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: 在固定上游提交上检查补丁
        shell: pwsh
        run: ./scripts/Prepare-Source.ps1 -SkipVendor
      - name: 检查契约审计工具
        run: |
          cargo test --locked --manifest-path tools/Cargo.toml --target-dir .work/contracts-target
          cargo build --locked --manifest-path tools/Cargo.toml --target-dir .work/contracts-target
      - name: 核对协议、配置键、快捷键和命令标识
        run: node tools/verify-contracts.mjs
